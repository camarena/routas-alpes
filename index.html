<!DOCTYPE html>
<html>
<head>
    <title>Alpine Moto Trip - Master Plan</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; height: -webkit-fill-available; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; color: #e0e0e0; display: flex; flex-direction: column; overflow: hidden;
        }

        .content-area { flex: 1; position: relative; overflow: hidden; background: #121212; }
        
        .tab-content { 
            display: none; height: 100%; width: 100%; position: absolute; top: 0; left: 0; 
            overflow-y: auto; -webkit-overflow-scrolling: touch; 
        }
        .tab-content.active { display: block; }

        .map-container { height: 100%; width: 100%; background: #222; }
        
        /* Uncollapsed Mobile Layer Controls */
        .leaflet-control-layers { 
            background: rgba(30, 30, 30, 0.95) !important; color: white !important; 
            border: 1px solid #555 !important; border-radius: 8px !important; padding: 6px !important;
            max-width: 60vw; max-height: 35vh; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3) !important;
        }
        .leaflet-control-layers-overlays label { display: flex; align-items: center; font-size: 12px; margin-bottom: 4px; }
        .leaflet-control-layers-selector { margin-right: 6px !important; }

        /* iOS Tab Navigation (3 Tabs) */
        .tab-bar {
            display: flex; background: #1e1e1e; border-top: 1px solid #333;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-button {
            flex: 1; background: transparent; color: #888; border: none; padding: 12px 0; 
            font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-button.active { color: #4facfe; }
        .icon { font-size: 18px; }
    </style>
</head>
<body>

    <div class="content-area">
        <!-- Pane A: Route A -->
        <div id="pane-a" class="tab-content active">
            <div id="mapA" class="map-container"></div>
        </div>

        <!-- Pane B: Route B (Grand Loop) -->
        <div id="pane-b" class="tab-content">
            <div id="mapB" class="map-container"></div>
        </div>

        <!-- Pane C: Route C (Final Master Plan) -->
        <div id="pane-c" class="tab-content">
            <div id="mapC" class="map-container"></div>
        </div>
    </div>

    <!-- Bottom Navigation (3 Tabs) -->
    <div class="tab-bar">
        <button class="tab-button active" onclick="openTab('pane-a', this)">
            <span class="icon">🗺️</span><span>Route A</span>
        </button>
        <button class="tab-button" onclick="openTab('pane-b', this)">
            <span class="icon">🔄</span><span>Route B</span>
        </button>
        <button class="tab-button" onclick="openTab('pane-c', this)">
            <span class="icon">⭐</span><span>Route C (Final)</span>
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function openTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
            
            setTimeout(() => {
                if (tabId === 'pane-a') mapA.invalidateSize();
                if (tabId === 'pane-b') mapB.invalidateSize();
                if (tabId === 'pane-c') mapC.invalidateSize();
            }, 100);
            
            setTimeout(() => {
                if (tabId === 'pane-a') mapA.invalidateSize();
                if (tabId === 'pane-b') mapB.invalidateSize();
                if (tabId === 'pane-c') mapC.invalidateSize();
            }, 400);
        }

        function loadRoutes(mapInstance, layerControl, routeDays, overnights) {
            routeDays.forEach(day => {
                const dayLayer = L.layerGroup().addTo(mapInstance);
                const label = `<span style="color: ${day.color}; margin-right: 6px; font-size: 14px;">■</span> ${day.name}`;
                layerControl.addOverlay(dayLayer, label);
                
                const coordString = day.coords.map(c => `${c[0]},${c[1]}`).join(';');
                const url = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;
                
                fetch(url).then(res => res.json()).then(data => {
                    if (data.routes && data.routes.length > 0) {
                        L.geoJSON(data.routes[0].geometry, { style: { color: day.color, weight: 6, opacity: 0.85 } })
                         .bindPopup(`<strong>${day.name}</strong><br>${(data.routes[0].distance / 1000).toFixed(1)} km`).addTo(dayLayer);
                    }
                });
            });

            overnights.forEach(stop => {
                L.circleMarker(stop.coords, {
                    radius: stop.name.includes("📍") ? 8 : 5, 
                    color: '#111', 
                    fillColor: stop.name.includes("📍") ? '#ffd700' : (stop.name.includes("Saved") ? '#00ffff' : '#fff'), 
                    fillOpacity: 1, weight: 2
                }).bindPopup(`<strong>${stop.name}</strong>`).addTo(mapInstance);
            });
        }

        // --- MAP A ---
        const mapA = L.map('mapA', { zoomControl: false }).setView([45.2, 6.8], 7);
        L.control.zoom({ position: 'topleft' }).addTo(mapA);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(mapA);
        const controlA = L.control.layers(null, null, { collapsed: false, position: 'topright' }).addTo(mapA);

        const daysA = [
            { name: "Day 1", color: "#e6194B", coords: [[6.46, 45.72], [6.57, 45.72], [6.69, 45.69], [6.77, 45.62], [6.67, 45.20]] },
            { name: "Day 2", color: "#f58231", coords: [[6.67, 45.20], [6.47, 45.21], [6.41, 45.06], [6.73, 44.82], [6.65, 44.66]] },
            { name: "Day 3", color: "#3cb44b", coords: [[6.65, 44.66], [6.63, 44.89], [6.66, 45.03], [6.70, 45.08], [7.05, 45.14]] },
            { name: "Day 4", color: "#4363d8", coords: [[7.05, 45.14], [6.93, 45.26], [6.67, 45.20], [6.39, 45.67], [6.87, 45.92]] },
            { name: "Day 5", color: "#911eb4", coords: [[6.87, 45.92], [7.07, 46.10], [6.84, 46.39], [6.58, 46.40]] },
            { name: "Day 6", color: "#f032e6", coords: [[6.58, 46.40], [6.47, 46.37], [6.10, 46.03], [6.12, 45.90]] }
        ];

        const overnightsA = [
            { name: "Queige", coords: [45.72, 6.46] }, { name: "Modane", coords: [45.20, 6.67] },
            { name: "Guillestre", coords: [44.66, 6.65] }, { name: "Susa", coords: [45.14, 7.05] },
            { name: "Chamonix", coords: [45.92, 6.87] }, { name: "Évian", coords: [46.40, 6.58] },
            { name: "Annecy", coords: [45.90, 6.12] }, { name: "📍 Barcelonnette", coords: [44.3867, 6.6531] },
            { name: "📍 Saved (Peisey-Nancroix)", coords: [45.5767, 6.7150] }
        ];
        loadRoutes(mapA, controlA, daysA, overnightsA);

        // --- MAP B (Grand Southern Loop) ---
        const mapB = L.map('mapB', { zoomControl: false }).setView([45.1, 6.8], 7);
        L.control.zoom({ position: 'topleft' }).addTo(mapB);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(mapB);
        const controlB = L.control.layers(null, null, { collapsed: false, position: 'topright' }).addTo(mapB);

        const daysB = [
            { name: "Day 1", color: "#e6194B", coords: [[6.46, 45.72], [6.39, 45.67], [6.38, 45.34], [6.35, 45.27], [6.43, 45.16]] },
            { name: "Day 2", color: "#f58231", coords: [[6.43, 45.16], [6.40, 45.06], [6.63, 44.89], [6.73, 44.82], [6.65, 44.66], [6.69, 44.56], [6.65, 44.38]] },
            { name: "Day 3", color: "#3cb44b", coords: [[6.65, 44.38], [6.93, 44.42], [7.44, 44.33], [7.49, 44.64], [7.05, 45.14]] },
            { name: "Day 4", color: "#4363d8", coords: [[7.05, 45.14], [6.93, 45.26], [6.87, 45.28], [7.03, 45.42], [6.77, 45.62]] },
            { name: "Day 5", color: "#911eb4", coords: [[6.77, 45.62], [6.69, 45.69], [6.57, 45.72], [6.53, 45.76], [6.42, 45.90]] },
            { name: "Day 6", color: "#f032e6", coords: [[6.42, 45.90], [6.12, 45.90]] }
        ];

        const overnightsB = [
            { name: "Queige", coords: [45.72, 6.46] }, { name: "Valloire", coords: [45.16, 6.43] },
            { name: "📍 Barcelonnette", coords: [44.3867, 6.6531] }, { name: "Susa", coords: [45.14, 7.05] },
            { name: "Bourg-St-Maurice", coords: [45.62, 6.77] }, { name: "La Clusaz", coords: [45.90, 6.42] },
            { name: "Annecy", coords: [45.90, 6.12] }, { name: "📍 Saved (Peisey-Nancroix)", coords: [45.5767, 6.7150] } 
        ];
        loadRoutes(mapB, controlB, daysB, overnightsB);

        // --- MAP C (Final Master Plan) ---
        const mapC = L.map('mapC', { zoomControl: false }).setView([45.3, 6.7], 7);
        L.control.zoom({ position: 'topleft' }).addTo(mapC);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(mapC);
        const controlC = L.control.layers(null, null, { collapsed: false, position: 'topright' }).addTo(mapC);

        const daysC = [
            { name: "Day 1: Val-Cenis", color: "#e6194B", coords: [[6.46, 45.72], [6.57, 45.72], [6.69, 45.69], [6.77, 45.62], [6.67, 45.20], [6.98, 45.21]] },
            { name: "Day 2: Guillestre", color: "#f58231", coords: [[6.98, 45.21], [6.67, 45.20], [6.47, 45.21], [6.41, 45.06], [6.73, 44.82], [6.65, 44.66]] },
            { name: "Day 3: Susa", color: "#3cb44b", coords: [[6.65, 44.66], [6.63, 44.89], [6.66, 45.03], [6.70, 45.08], [7.05, 45.14]] },
            { name: "Day 4: Chamonix", color: "#4363d8", coords: [[7.05, 45.14], [6.93, 45.26], [6.67, 45.20], [6.39, 45.67], [6.87, 45.92]] },
            { name: "Day 5: Lavaux", color: "#911eb4", coords: [[6.87, 45.92], [7.07, 46.10], [6.65, 46.46], [6.58, 46.40]] },
            { name: "Day 6: Yvoire", color: "#f032e6", coords: [[6.58, 46.40], [6.32, 46.36], [6.10, 46.03], [6.12, 45.90]] }
        ];

        const overnightsC = [
            { name: "Queige (Start)", coords: [45.72, 6.46] }, { name: "Val-Cenis (Night 1)", coords: [45.21, 6.98] },
            { name: "Guillestre (Night 2)", coords: [44.66, 6.65] }, { name: "Susa (Night 3)", coords: [45.14, 7.05] },
            { name: "Chamonix (Night 4)", coords: [45.92, 6.87] }, { name: "Évian-les-Bains (Night 5)", coords: [46.40, 6.58] },
            { name: "📍 Yvoire (Coffee)", coords: [46.36, 6.32] }, { name: "Annecy (Finish)", coords: [45.90, 6.12] },
            { name: "📍 Saved (Peisey-Nancroix)", coords: [45.5767, 6.7150] }
        ];
        loadRoutes(mapC, controlC, daysC, overnightsC);
    </script>
</body>
</html>
